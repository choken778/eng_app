<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EngLogic 卡片</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #007aff; }
        body { font-family: -apple-system; margin: 0; background: #f2f2f7; color: #1c1c1e; }
        
        /* 顶部导航 */
        .nav { display: flex; justify-content: space-around; padding: 15px; background: white; border-bottom: 1px solid #d1d1d6; }
        .nav button { background: none; border: none; color: var(--primary); font-size: 16px; font-weight: 600; }

        /* 滑动容器 */
        #card-container { 
            display: none; /* 默认隐藏，点击复习显示 */
            overflow-x: auto; 
            scroll-snap-type: x mandatory; 
            webkit-overflow-scrolling: touch;
            display: flex; 
            height: 70vh;
            align-items: center;
        }

        /* 单个卡片样式 */
        .card { 
            min-width: 80vw; 
            height: 50vh; 
            margin: 0 10vw; 
            background: white; 
            border-radius: 25px; 
            scroll-snap-align: center; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }

        .card .word { font-size: 2.5rem; font-weight: bold; margin-bottom: 20px; }
        .card .mean { font-size: 1.2rem; color: #8e8e93; display: none; } /* 默认隐藏翻译 */
        .card.flipped .mean { display: block; } /* 翻转后显示 */

        /* 录入列表样式 */
        #list-view { padding: 20px; }
        .input-box { background: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; }
        input { width: 100%; border: 1px solid #ddd; padding: 12px; margin: 8px 0; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .btn-main { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav">
        <button onclick="showView('list')">录入列表</button>
        <button onclick="showView('cards')">卡片复习</button>
    </div>

    <div id="list-view">
        <div class="input-box">
            <input type="text" id="word" placeholder="新单词 (可通过图片复制)">
            <input type="text" id="mean" placeholder="中文意思">
            <button class="btn-main" onclick="saveWord()">存入单词本</button>
        </div>
        <div id="word-list-items"></div>
    </div>

    <div id="card-container">
        </div>

    <script>
        function saveWord() {
            const w = document.getElementById('word').value;
            const m = document.getElementById('mean').value;
            if(!w || !m) return;
            const words = JSON.parse(localStorage.getItem('myWords') || '[]');
            words.push({w, m, id: Date.now()});
            localStorage.setItem('myWords', JSON.stringify(words));
            document.getElementById('word').value = '';
            document.getElementById('mean').value = '';
            renderList();
        }

        function showView(view) {
            if(view === 'list') {
                document.getElementById('list-view').style.display = 'block';
                document.getElementById('card-container').style.display = 'none';
            } else {
                document.getElementById('list-view').style.display = 'none';
                document.getElementById('card-container').style.display = 'flex';
                renderCards();
            }
        }

        function renderList() {
            const words = JSON.parse(localStorage.getItem('myWords') || '[]');
            document.getElementById('word-list-items').innerHTML = words.reverse().map(item => `
                <div style="background:white; padding:15px; border-radius:12px; margin-top:10px; display:flex; justify-content:space-between;">
                    <span><b>${item.w}</b>: ${item.m}</span>
                </div>
            `).join('');
        }

        function renderCards() {
            const words = JSON.parse(localStorage.getItem('myWords') || '[]');
            if(words.length === 0) {
                document.getElementById('card-container').innerHTML = '<div class="card">请先添加单词</div>';
                return;
            }
            document.getElementById('card-container').innerHTML = words.map(item => `
                <div class="card" onclick="this.classList.toggle('flipped')">
                    <div class="word">${item.w}</div>
                    <div class="mean">${item.m}</div>
                    <p style="position:absolute; bottom:20px; font-size:12px; color:#ccc;">点击翻转卡片</p>
                </div>
            `).join('');
        }

        function speak(text) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            window.speechSynthesis.speak(msg);
        }

        // 初始化
        renderList();
    </script>
</body>
</html>
